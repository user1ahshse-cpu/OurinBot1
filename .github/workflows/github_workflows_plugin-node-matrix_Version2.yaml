name: Plugin & Node matrix check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ '20', '24' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system libs (for canvas/sharp)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev libpng-dev libfreetype6-dev build-essential pkg-config

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Syntax check all JS files
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Run ESLint (project config)
        run: |
          npx eslint . --ext .js -f unix -o eslint-report-${{ matrix.node-version }}.txt || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report-${{ matrix.node-version }}
          path: eslint-report-${{ matrix.node-version }}.txt

      - name: Run plugin import smoke test
        run: |
          node check-plugins.js
