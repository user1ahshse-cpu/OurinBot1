name: Sanity Check on: push: branches: [ fix/esm-consistency ] pull_request: branches: [ main ]

jobs: sanity: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Setup Node.js uses: actions/setup-node@v4 with: node-version: '22' - name: Install dependencies run: npm ci - name: Run sanity check run: npm run sanity-check
