name: ESLint Auto Fix (create PR)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  eslint-fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies (skip lifecycle scripts)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Create minimal ESLint config
        run: |
          cat > /tmp/eslint-min.json << 'EOF'
          {
            "env": { "es2021": true, "node": true, "browser": false },
            "parserOptions": { "ecmaVersion": 2021, "sourceType": "script" },
            "rules": {
              "no-unused-vars": "warn",
              "no-undef": "error"
            }
          }
          EOF

      - name: Run ESLint --fix (isolated) and ensure report exists
        run: |
          # ensure report file exists even if eslint outputs nothing
          : > eslint-report.txt
          npx eslint "plugins/" --ext .js --config /tmp/eslint-min.json --fix -f unix -o eslint-report.txt || true
          # make sure report exists
          test -f eslint-report.txt || : > eslint-report.txt

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.txt

      - name: Debug git state before commit
        run: |
          echo "---- git status ----"
          git status --porcelain --branch || true
          echo "---- git log -1 ----"
          git --no-pager log -1 --stat || true
          echo "---- remotes ----"
          git remote -v || true
          echo "---- HEAD ----"
          git rev-parse --abbrev-ref HEAD || true
          echo "---- show staged ----"
          git diff --cached --name-only || true

      - name: Commit fixes (only update tracked files)
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage only modified tracked files so node_modules / new files are NOT added
          git add -u
          git status
          if git diff --cached --quiet; then
            echo "No lint fixes to commit"
            exit 0
          else
            git commit -m "chore: apply ESLint --fix (auto)"
          fi

      - name: Create Pull Request with fixes
        uses: peter-evans/create-pull-request@v5
        with:
          # Prefer a Personal Access Token (PERSONAL_TOKEN) stored in repo secrets for reliable write access.
          # If you want to use the default GITHUB_TOKEN instead, change this to: token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.PERSONAL_TOKEN }}
          commit-message: "chore: apply ESLint --fix (auto)"
          branch: "eslint-fix-auto/${{ github.run_id }}"
          title: "chore: ESLint fixes (auto)"
          body: "This PR contains automatic ESLint --fix changes."
