name: Create minimal ESLint config run: | cat > /tmp/eslint-min.json << 'EOF' { "env": { "es2021": true, "node": true, "browser": false }, "parserOptions": { "ecmaVersion": 2021, "sourceType": "script" }, "rules": { "no-unused-vars": "warn", "no-undef": "error" } } EOF

name: Run ESLint --fix (isolated) run: | npx eslint "plugins/" --ext .js --config /tmp/eslint-min.json --fix -f unix -o eslint-report.txt || true
